[package]
name = "argocd-cleanup"
version = "0.1.0"
edition = "2024"

[dependencies]
kube = { version = "2.0.1", features = ["client", "derive", "runtime"] }
k8s-openapi = { version = "0.26.0", features = ["latest", "schemars"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
